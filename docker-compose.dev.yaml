services:
  api:
    extends:
      file: docker-compose.base.yaml
      service: api
    volumes:
      - "./src/prodik/:/prodik/src/prodik/"

  prometheus:
    extends:
      file: docker-compose.base.yaml
      service: prometheus

  nginx:
    extends:
      file: docker-compose.base.yaml
      service: nginx

  node-exporter:
    extends:
      file: docker-compose.base.yaml
      service: node-exporter

  grafana:
    extends:
      file: docker-compose.base.yaml
      service: grafana

  postgres:
    extends:
      file: docker-compose.base.yaml
      service: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 15s
      timeout: 15s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:

networks:
  prodik-network:
    driver: bridge