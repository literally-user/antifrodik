services:
    api:
        extends:
            file: docker-compose.base.yaml
            service: api

        volumes:
            - "./src/prodik/:/prodik/src/prodik/"

    postgres:
        extends:
            file: docker-compose.base.yaml
            service: postgres

        volumes:
            - ./.docker-volumes/postgres:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    prodik-network:
        driver: bridge
