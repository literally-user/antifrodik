services:
  code:
    restart: on-failure
    build: .

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus-data:/prometheus
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - prodik-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    networks:
      - prodik-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_password
    volumes:
      - grafana-data:/var/lib/grafana

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - prodik-network
    env_file:
      - "./.env"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    networks:
      - prodik-network

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - api
    ports:
      - 80:80
    networks:
      - prodik-network
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf

  api:
    container_name: api
    command: ["prodik", "api", "run"]
    extends:
      service: code
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prodik-network
    env_file:
      - "./.env"

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:

networks:
  prodik-network:
    driver: bridge